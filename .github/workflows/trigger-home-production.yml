name: Trigger Home Production Build

on:
  push:
    branches: [ production ]
    # A change to the workflows themselves is not a content change.
    paths-ignore: [ '.github/**' ]
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: Aspose/apireference.aspose.com
          event-type: build-home-production
